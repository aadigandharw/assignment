<div style="
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
">

    <div style="
        background:#ffffff;
        width:100%;
        max-width:420px;
        padding:30px;
        border-radius:12px;
        border: 1px solid black;
    ">

        <h2 style="
            text-align:center;
            margin-bottom:25px;
            color:#333;
        ">Add Details</h2>

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom:18px;">
                <label style="
                    display:block;
                    margin-bottom:6px;
                    font-weight:bold;
                    color:#444;
                ">Name</label>
                <input type="text" name="name" placeholder="Enter your name" required
                    style="
                        width:100%;
                        padding:10px 12px;
                        border:1px solid #ccc;
                        border-radius:6px;
                        font-size:14px;
                    ">
            </div>
            <div style="margin-bottom:18px;">
                <label style="
                    display:block;
                    margin-bottom:6px;
                    font-weight:bold;
                    color:#444;
                ">Email</label>
                <input type="email" name="email" placeholder="Enter your email" required
                    style="
                        width:100%;
                        padding:10px 12px;
                        border:1px solid #ccc;
                        border-radius:6px;
                        font-size:14px;
                        outline:none;
                    ">
            </div>

            <div style="margin-bottom:22px;">
                <label style="
                    display:block;
                    margin-bottom:6px;
                    font-weight:bold;
                    color:#444;
                ">Role</label>
                <input type="text" name="role" placeholder="Enter your role" required
                    style="
                        width:100%;
                        padding:10px 12px;
                        border:1px solid #ccc;
                        border-radius:6px;
                        font-size:14px;
                        outline:none;
                    ">
            </div>

            <button type="submit"
                style="
                    width:100%;
                    padding:12px;
                    background:#0072ff;
                    border:none;
                    border-radius:6px;
                    color:#fff;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                ">
                Save
            </button>
        </form>

    </div>
</div>
